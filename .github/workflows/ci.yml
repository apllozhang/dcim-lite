name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./internal/integration/
      - name: unit tests (race detector)
        # 显式路径:frontend/app/node_modules 安装后不进入 Go 包匹配范围
        run: go test -race ./cmd/... ./internal/... -count=1
      - name: route inventory contract
        run: go test ./internal/app/ -run TestRouteInventory -v -count=1
      - name: build
        run: go build ./cmd/server
      - name: python evidence selftests (复评 P1-N2：证据工具自身回归门禁)
        run: |
          python3 -m pip install --quiet pyyaml pytest
          python3 tests/sandbox/selfcheck_evidence_compiler.py
          python3 tests/sandbox/selfcheck_finalize_run.py
          python3 tests/sandbox/selfcheck_finalize_run_v5.py
          # P1-R5:语义字段门禁负向自测(未知路径/错误枚举/null/敏感值/非时间戳/CLOSED 重现/ratchet)
          python3 tests/diff/selfcheck_field_gate.py
          # pytest 不得误收集 selfcheck 文件（收集到的用例数必须为 0）
          n=$(python3 -m pytest tests/sandbox/ --collect-only -q 2>/dev/null | grep -c "::" || true)
          echo "collected: $n"
          test "$n" -eq 0
      - name: field-decision ledger gate (P1-C③+P1-R5：语义门禁与冻结差分报告双向一致)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/diff/field_gate.py \
            --ledger docs/field-diff-decisions.yaml \
            --report docs/DIFF-REPLAY-FINAL-20260911.json \
            --out field-gate-summary.json

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb # 16-alpine
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://it:it@localhost:5432/it?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: integration tests (race detector, concurrency & transactions)
        run: go test -race -tags integration ./internal/integration/ -v -count=1

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: govulncheck（标准库与依赖漏洞，仅报告实际调用的符号）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          $(go env GOPATH)/bin/govulncheck ./...
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          artifact-name: dcim-lite-sbom

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    services:
      postgres:
        image: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb # 16-alpine
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        working-directory: .
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: install dependencies
        run: npm ci
      - name: OpenAPI typegen + contract drift check
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/generated/schema.d.ts || \
            (echo "openapi.yaml 与已提交的生成类型不一致,请重新 gen:api 并提交" && exit 1)
      - name: lint (eslint + prettier)
        run: npm run lint
      - name: unit tests (vitest)
        run: npm test
      - name: build (vue-tsc + vite)
        run: npm run build
      - name: build backend binary (for e2e)
        working-directory: .
        run: go build -o /tmp/cabinet-server ./cmd/server
      - name: start backend for e2e (real PG + real binary)
        working-directory: .
        env:
          DATABASE_URL: postgres://it:it@localhost:5432/it?sslmode=disable
          HTTP_ADDR: ":18080"
          JWT_SECRET: e2e-test-secret-that-is-at-least-32-bytes-long!!
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: E2E#Passw0rd!
          MIGRATIONS_DIR: ${{ github.workspace }}/migrations
          LOGIN_RATE_LIMIT_PER_MIN: "200"
        run: |
          nohup /tmp/cabinet-server > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/health/ready && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/health/ready || (cat /tmp/backend.log && exit 1)
      - name: start real legacy static site (P0-R1:回退演练必须加载真旧页面)
        working-directory: .
        run: |
          # vite 代理保留 /legacy 前缀:文件必须布在 legacy/ 子目录下,
          # 使 /legacy/ → legacy/index.html、/legacy/assets/x → legacy/assets/x
          mkdir -p /tmp/legacy-site/legacy
          cp -r frontend/ale/. /tmp/legacy-site/legacy/
          # 旧 index.html 用绝对路径 /assets/...,改写到 /legacy/assets/ 才能经 preview 代理命中旧站点
          sed -i 's|/assets/|/legacy/assets/|g' /tmp/legacy-site/legacy/index.html
          docker run -d --name legacy-site -v /tmp/legacy-site:/usr/share/nginx/html:ro -p 18081:80 nginx:alpine
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:18081/legacy/index.html && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:18081/legacy/index.html
      - name: Playwright e2e (real backend, real legacy site)
        env:
          ALE_API_PROXY: http://127.0.0.1:18080
          # P0-R1:legacy 代理必须指向真实旧 bundle 站点(此前错指后端,回退演练为假阳性)
          ALE_LEGACY_PROXY: http://127.0.0.1:18081
          E2E_USERNAME: admin
          E2E_PASSWORD: E2E#Passw0rd!
          APP_RELEASE: ci-${{ github.sha }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: e2e negative (P0-R1:legacy 代理错指后端时演练必须失败)
        env:
          ALE_API_PROXY: http://127.0.0.1:18080
          ALE_LEGACY_PROXY: http://127.0.0.1:18080
          E2E_USERNAME: admin
          E2E_PASSWORD: E2E#Passw0rd!
          APP_RELEASE: ci-negative
        run: |
          set +e
          npx playwright test shell.spec.ts -g "回退演练" --retries=0 --workers=1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "NEGATIVE FAILED: 回退演练在 legacy 代理错指后端时仍然通过 → 断言无鉴别力"
            exit 1
          fi
          echo "NEGATIVE OK: 错误配置下演练如预期失败,断言有效"
      - name: flag build-injection check (P0-R2:构建注入必须进入产物)
        run: |
          VITE_ALE_LEGACY_BASE=/wl-inject npx vite build --outDir dist-inject --emptyOutDir --logLevel error
          grep -q "/wl-inject" dist-inject/assets/*.js
          rm -rf dist-inject
