name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./internal/integration/
      - name: unit tests (race detector)
        run: go test -race ./... -count=1
      - name: route inventory contract
        run: go test ./internal/app/ -run TestRouteInventory -v -count=1
      - name: build
        run: go build ./cmd/server
      - name: python evidence selftests (复评 P1-N2：证据工具自身回归门禁)
        run: |
          python3 -m pip install --quiet pyyaml pytest
          python3 tests/sandbox/selfcheck_evidence_compiler.py
          python3 tests/sandbox/selfcheck_finalize_run.py
          python3 tests/sandbox/selfcheck_finalize_run_v5.py
          # pytest 不得误收集 selfcheck 文件（收集到的用例数必须为 0）
          n=$(python3 -m pytest tests/sandbox/ --collect-only -q 2>/dev/null | grep -c "::" || true)
          echo "collected: $n"
          test "$n" -eq 0

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://it:it@localhost:5432/it?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: integration tests (race detector, concurrency & transactions)
        run: go test -race -tags integration ./internal/integration/ -v -count=1

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: govulncheck（标准库与依赖漏洞，仅报告实际调用的符号）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: dcim-lite-sbom
