name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./internal/integration/
      - name: unit tests (race detector)
        # 显式路径:frontend/app/node_modules 安装后不进入 Go 包匹配范围
        run: go test -race ./cmd/... ./internal/... -count=1
      - name: route inventory contract
        run: go test ./internal/app/ -run TestRouteInventory -v -count=1
      - name: build
        run: go build ./cmd/server
      - name: python evidence selftests (复评 P1-N2：证据工具自身回归门禁)
        run: |
          python3 -m pip install --quiet pyyaml pytest
          python3 tests/sandbox/selfcheck_evidence_compiler.py
          python3 tests/sandbox/selfcheck_finalize_run.py
          python3 tests/sandbox/selfcheck_finalize_run_v5.py
          # pytest 不得误收集 selfcheck 文件（收集到的用例数必须为 0）
          n=$(python3 -m pytest tests/sandbox/ --collect-only -q 2>/dev/null | grep -c "::" || true)
          echo "collected: $n"
          test "$n" -eq 0
      - name: field-decision ledger gate (P1-C③：台账 schema/唯一键 + 与冻结差分报告双向一致)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/diff/field_gate.py \
            --ledger docs/field-diff-decisions.yaml \
            --report docs/DIFF-REPLAY-FINAL-20260911.json \
            --out field-gate-summary.json

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://it:it@localhost:5432/it?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: integration tests (race detector, concurrency & transactions)
        run: go test -race -tags integration ./internal/integration/ -v -count=1

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: govulncheck（标准库与依赖漏洞，仅报告实际调用的符号）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: dcim-lite-sbom

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        working-directory: .
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: install dependencies
        run: npm ci
      - name: OpenAPI typegen + contract drift check
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/generated/schema.d.ts || \
            (echo "openapi.yaml 与已提交的生成类型不一致,请重新 gen:api 并提交" && exit 1)
      - name: lint (eslint + prettier)
        run: npm run lint
      - name: unit tests (vitest)
        run: npm test
      - name: build (vue-tsc + vite)
        run: npm run build
      - name: build backend binary (for e2e)
        working-directory: .
        run: go build -o /tmp/cabinet-server ./cmd/server
      - name: start backend for e2e (real PG + real binary)
        working-directory: .
        env:
          DATABASE_URL: postgres://it:it@localhost:5432/it?sslmode=disable
          HTTP_ADDR: ":18080"
          JWT_SECRET: e2e-test-secret-that-is-at-least-32-bytes-long!!
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: E2E#Passw0rd!
          MIGRATIONS_DIR: ${{ github.workspace }}/migrations
          LOGIN_RATE_LIMIT_PER_MIN: "200"
        run: |
          nohup /tmp/cabinet-server > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/health/ready && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/health/ready || (cat /tmp/backend.log && exit 1)
      - name: Playwright e2e (real backend, P1-R07)
        env:
          ALE_API_PROXY: http://127.0.0.1:18080
          ALE_LEGACY_PROXY: http://127.0.0.1:18080
          E2E_USERNAME: admin
          E2E_PASSWORD: E2E#Passw0rd!
          APP_RELEASE: ci-${{ github.sha }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
