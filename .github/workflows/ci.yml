name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./internal/integration/
      - name: unit tests (race detector)
        run: go test -race ./... -count=1
      - name: route inventory contract
        run: go test ./internal/app/ -run TestRouteInventory -v -count=1
      - name: build
        run: go build ./cmd/server

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://it:it@localhost:5432/it?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go module download (retry against flaky proxy)
        run: |
          ok=0
          for i in 1 2 3; do
            if go mod download all; then ok=1; break; fi
            echo "retry $i failed, waiting..."; sleep 10
          done
          [ "$ok" = "1" ] || exit 1
      - name: integration tests (race detector, concurrency & transactions)
        run: go test -race -tags integration ./internal/integration/ -v -count=1
