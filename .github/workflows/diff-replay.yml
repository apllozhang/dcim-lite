# 差分回放防漂移门禁：每日用仓库内冻结的厂商基线（tests/diff/baseline），
# 对当前 main 构建的候选做全量 golden 套件回放（tests/sandbox/gt_final_v3.py）。
# 任何行为漂移都会在 diff-report.json 里产生真实断裂（breaks 非空）→ 本 job 失败。
name: diff-replay

on:
  schedule:
    - cron: "0 3 * * *" # 每日 UTC 03:00
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: build candidate image (main)
        run: docker build -t diff-rebuild:ci .

      - name: start isolated stack
        working-directory: tests/diff
        run: docker compose -f docker-compose.ci.yml up -d

      - name: wait for candidate
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health/live || true)
            [ "$code" = "200" ] && echo "candidate alive" && exit 0
            sleep 2
          done
          echo "candidate did not come up" >&2
          docker compose -f tests/diff/docker-compose.ci.yml logs backend
          exit 1

      - name: replay golden suite against candidate
        working-directory: tests/sandbox
        env:
          GT_CAPTCHA: auto
        run: |
          python3 gt_final_v3.py \
            --env-file ../diff/ci.env \
            --run-id "ci-$GITHUB_RUN_ID" \
            --pg none \
            --out "$GITHUB_WORKSPACE/out" \
            --api http://127.0.0.1:18080

      - name: summarize failures (if any)
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/out/final-regression/results.jsonl"
          [ -f "$f" ] && python3 -c "
          import json
          rows = [json.loads(l) for l in open('$f') if l.strip()]
          bad = [r for r in rows if r['status'] in ('FAIL', 'ERROR', 'BLOCKED')]
          print(f'FAIL/ERROR/BLOCKED: {len(bad)}')
          for r in bad:
              print(' ', r['status'], r['caseId'], '|', r['httpStatus'], r['actualCode'], '|', r.get('note', '')[:120])
          " || echo "no results file"

      - name: compare against frozen vendor baseline
        working-directory: tests/sandbox
        run: |
          python3 diff_compare_v2.py \
            ../diff/baseline \
            "$GITHUB_WORKSPACE/out/final-regression" \
            "$GITHUB_WORKSPACE/diff-report.md"

      - name: gate (zero real breaks + compat floor)
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("diff-report.json"))
          breaks = d.get("breaks", [])
          rate = d.get("compat_rate_status_code")
          print(f"compat_rate_status_code={rate}%  real_breaks={len(breaks)}")
          if breaks:
              for x in breaks:
                  print("  BREAK:", x["caseId"], "|", x["why"])
          if breaks:
              sys.exit("diff drift detected: real breaks against frozen vendor baseline")
          if rate is None or rate < 80.0:
              sys.exit(f"compat rate {rate}% below gate (80%)")
          print("diff-replay gate: PASS")
          PY

      # ── P1-C② 确定性双库验证:抹卷重启得到第二套全新库,再回放一遍 ──
      - name: reset stack for second fresh-DB run
        working-directory: tests/diff
        run: |
          docker compose -f docker-compose.ci.yml down -v
          docker compose -f docker-compose.ci.yml up -d
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health/ready || true)
            [ "$code" = "200" ] && echo "candidate ready" && exit 0
            sleep 2
          done
          echo "candidate did not come back" >&2
          exit 1

      - name: replay golden suite (second fresh DB)
        working-directory: tests/sandbox
        env:
          GT_CAPTCHA: auto
        run: |
          python3 gt_final_v3.py \
            --env-file ../diff/ci.env \
            --run-id "ci-$GITHUB_RUN_ID-b" \
            --pg none \
            --out "$GITHUB_WORKSPACE/out-run2" \
            --api http://127.0.0.1:18080

      - name: compare run2 vs run1 (determinism)
        working-directory: tests/sandbox
        run: |
          python3 diff_compare_v2.py \
            "$GITHUB_WORKSPACE/out/final-regression" \
            "$GITHUB_WORKSPACE/out-run2/final-regression" \
            "$GITHUB_WORKSPACE/determinism-report.md"

      - name: determinism gate (P1-C②③：两套全新库间除已登记噪声外零差异)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 tests/diff/determinism_gate.py \
            --ledger docs/field-diff-decisions.yaml \
            --report determinism-report.json \
            --out determinism-gate.json

      - name: field gate (P1-C③：未知字段差异默认失败 + 台账双向一致 + 字段兼容率下限)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          # 候选镜像 Id 随门禁摘要一并上报，便于追溯（本地构建无 RepoDigest，用 .Id）
          d=$(docker image inspect diff-rebuild:ci --format '{{.Id}}' 2>/dev/null | head -n1 | tr -d '\r\n')
          export FIELD_GATE_IMAGE_DIGEST="local-build:${d:-unknown}"
          python3 tests/diff/field_gate.py \
            --ledger docs/field-diff-decisions.yaml \
            --report diff-report.json \
            --out field-gate.json

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-report
          path: |
            diff-report.md
            diff-report.json
            field-gate.json
            determinism-report.md
            determinism-report.json
            determinism-gate.json
