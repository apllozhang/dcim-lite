# dcim-lite 自主前端(ale-app)反向代理与静态资源策略
# P0-R3/P1-D:双 server 架构 ——
#   80 端口:新前端(SPA)+ 后端反代;
#   19501 端口:旧 ALE bundle 独立源(HTML5 history 模式必须以根路径服务,
#   /legacy/ 前缀下旧应用无法路由——CI 与现场双跑均已验证)。
# 旧 bundle 静态资源(backend /legacy 卷)自包含;上游 backend 经 compose 网络别名解析。

# ───────────────── 新前端(:80) ─────────────────
server {
    listen 80;

    # 新前端 index.html 不缓存(hash 引用随构建变化,静态资源长缓存)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # 新前端静态资源:命中即长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 后端反代(与部署形态一致:同源 /api)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /health/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    # /metrics 不经公网前端暴露(P1-R6/第三轮 §10.2):显式 404,
    # 采集端通过 compose 网络直连 backend:8080/metrics
    location = /metrics {
        return 404;
    }

    # SPA fallback
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ───────────────── 旧 ALE 独立源(:19501) ─────────────────
# 回退目标:feature flag 切换整页跳转至此(LEGACY_BASE 默认 = 同主机:19501)。
server {
    listen 19501;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /health/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 旧 bundle 静态资源 + HTML5 history fallback
    location /assets/ {
        root /usr/share/nginx/legacy;
        try_files $uri =404;
        expires 30d;
    }
    location / {
        root /usr/share/nginx/legacy;
        index index.html;
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
