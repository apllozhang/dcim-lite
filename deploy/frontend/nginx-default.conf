# dcim-lite 自主前端(ale-app)反向代理与静态资源策略
# P0-R3:19500 部署形态的源码化定义。旧 bundle 资源(backend /legacy 卷)自包含,
# 不再依赖外部 oracle 容器;上游 backend 经 compose 网络别名解析。
server {
    listen 80;

# 新前端 index.html 不缓存(hash 引用随构建变化,静态资源长缓存)
location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
}

# 新前端静态资源:命中即长缓存;未命中回落旧 bundle(旧产物绝对路径 /assets/ 同命名空间)
location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri @legacy_asset;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location @legacy_asset {
    root /usr/share/nginx/legacy;
}

# 旧 ALE 单页(hash 路由),从仓库 frontend/ale 卷提供
location /legacy/ {
    alias /usr/share/nginx/legacy/;
    index index.html;
    try_files $uri $uri/ /legacy/index.html;
}

# 后端反代(与部署形态一致:同源 /api)
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /health/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
}
location /metrics {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
}

# SPA fallback
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
}

# 安全头(静态与反代统一)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
