services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cabinet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cabinet
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - rebuild_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinet -d cabinet"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://cabinet:${POSTGRES_PASSWORD}@postgres:5432/cabinet?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-7200}
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18080}:8080"

volumes:
  rebuild_pgdata:
