openapi: 3.0.3
info:
  title: dcim-lite API
  version: 0.3.0
  description: |
    轻量 DCIM（数据中心台账）系统 API 契约。
    统一响应信封：{"code","message","data","requestId"}；
    乐观锁：PUT/DELETE 携带 ?version=（move 类可放 body），冲突返回 409 RESOURCE_VERSION_CONFLICT；
    软删除：deleted_at，唯一索引带 WHERE deleted_at IS NULL。
    行为差异决策见 docs/COMPAT-DECISIONS.md。
    路径与权限矩阵与 internal/app/routes_test.go 联动（路由漂移会使测试失败）；
    请求体 schema 全量定义于本文件 components（requestBodies/schemas）。
servers:
  - url: http://10.20.30.203:19173
    description: 内网部署（nginx 代理）
security:
  - bearerAuth: []

paths:
  /health/live:
    get:
      summary: 存活探针（data.status=alive）
      security: []
      responses:
        "200": { $ref: "#/components/responses/HealthOK" }
  /health/ready:
    get:
      summary: 就绪探针（检查数据库）
      security: []
      responses:
        "200": { $ref: "#/components/responses/HealthOK" }
        "503": { $ref: "#/components/responses/Fail" }
  /metrics:
    get:
      summary: Prometheus 指标（请求计数/时延，路径为路由模板）
      security: []
      responses:
        "200":
          description: Prometheus 文本格式
          content:
            text/plain:
              schema: { type: string }
  /api/v1/auth/captcha:
    get:
      summary: 获取验证码（SVG data-url，单实例内存，5 分钟有效，一次性）
      security: []
      responses:
        "200": { $ref: "#/components/responses/CaptchaOK" }
  /api/v1/auth/login:
    post:
      summary: 登录（需验证码；每 IP 每分钟 10 次；连续失败 5 次锁 15 分钟）
      security: []
      requestBody: { $ref: "#/components/requestBodies/LoginBody" }
      responses:
        "200": { $ref: "#/components/responses/LoginOK" }
        "400": { $ref: "#/components/responses/Fail" }
        "401": { $ref: "#/components/responses/Fail" }
        "403": { $ref: "#/components/responses/Fail" }
        "429": { $ref: "#/components/responses/Fail" }
  /api/v1/auth/me:
    get:
      summary: 当前用户信息
      responses:
        "200": { $ref: "#/components/responses/UserOK" }
        "401": { $ref: "#/components/responses/Fail" }
  /api/v1/auth/logout:
    post:
      summary: 登出（吊销当前 token，立即失效）
      responses:
        "200": { $ref: "#/components/responses/OK" }

  # ── 只读查询（登录即可） ─────────────────────────────
  /api/v1/resource-tree:
    get:
      summary: 数据中心-机房-机柜资源树
      responses:
        "200": { $ref: "#/components/responses/TreeOK" }
  /api/v1/racks-page:
    get:
      summary: 机柜分页列表
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 200 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: roomId, in: query, schema: { type: string, format: uuid } }
        - { name: dataCenterId, in: query, schema: { type: string, format: uuid } }
        - { name: sortBy, in: query, schema: { type: string, enum: [code, name, status, uHeight, createdAt] } }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200": { $ref: "#/components/responses/RackListOK" }
  /api/v1/device-types:
    get:
      summary: 设备类型列表
      responses:
        "200": { $ref: "#/components/responses/DeviceTypeListOK" }
    post:
      summary: 创建设备类型
      requestBody: { $ref: "#/components/requestBodies/DeviceTypeBody" }
      responses:
        "200": { $ref: "#/components/responses/DeviceTypeOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/devices:
    get:
      summary: 设备分页列表
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: typeId, in: query, schema: { type: string, format: uuid } }
        - { name: rackId, in: query, schema: { type: string, format: uuid } }
        - { name: lifecycleStatus, in: query, schema: { type: string } }
        - { name: sortBy, in: query, schema: { type: string } }
        - { name: sortDir, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/DeviceListOK" }
    post:
      summary: 创建设备（编码缺省自动生成；heightU 必须 >=1）
      requestBody: { $ref: "#/components/requestBodies/DeviceBody" }
      responses:
        "200": { $ref: "#/components/responses/DeviceOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/devices/import-template:
    get:
      summary: 下载设备导入 Excel 模板
      responses:
        "200":
          description: xlsx 文件流
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /api/v1/devices/{id}:
    get:
      summary: 设备详情（含 currentPosition）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/DeviceOK" }
        "404": { $ref: "#/components/responses/Fail" }
    put:
      summary: 更新设备（在位禁改高度；生命周期不可直改）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/DeviceBody" }
      responses:
        "200": { $ref: "#/components/responses/DeviceOK" }
        "409": { $ref: "#/components/responses/Fail" }
    delete:
      summary: 删除设备（在位时 409，先下架）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/devices/{id}/history:
    get:
      summary: 设备位置履历
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/HistoryListOK" }
  /api/v1/racks/{id}/u-layout:
    get:
      summary: 机柜 U 位布局（positions + free 空闲段 + 设备摘要）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/ULayoutOK" }
  /api/v1/rack-templates:
    get:
      summary: 机柜模板列表（含版本）
      responses:
        "200": { $ref: "#/components/responses/TemplateListOK" }
    post:
      summary: 创建机柜模板（含首版本）
      requestBody: { $ref: "#/components/requestBodies/TemplateCreateBody" }
      responses:
        "200": { $ref: "#/components/responses/TemplateOK" }
  /api/v1/racks/{id}/pdus:
    get:
      summary: 机柜下 PDU 列表
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/PDUListOK" }
    post:
      summary: 创建 PDU
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/PDUBody" }
      responses:
        "200": { $ref: "#/components/responses/PDUOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/pdus/{id}/sockets:
    get:
      summary: PDU 插座列表
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/SocketListOK" }
    post:
      summary: 创建插座（编号唯一，制式 CN/EU）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/SocketBody" }
      responses:
        "200": { $ref: "#/components/responses/SocketOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/racks/{id}/pdu-connections:
    get:
      summary: 机柜 PDU 连接列表
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/ConnectionListOK" }

  # ── 资源写（system_admin） ───────────────────────────
  /api/v1/data-centers:
    post:
      summary: 创建数据中心
      requestBody: { $ref: "#/components/requestBodies/DataCenterBody" }
      responses:
        "200": { $ref: "#/components/responses/DataCenterOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/data-centers/{id}:
    put:
      summary: 更新数据中心
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/DataCenterBody" }
      responses:
        "200": { $ref: "#/components/responses/DataCenterOK" }
        "409": { $ref: "#/components/responses/Fail" }
    delete:
      summary: 删除数据中心（有机房时 409）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/data-centers/{id}/rooms:
    post:
      summary: 创建机房（父级停用 409）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/RoomBody" }
      responses:
        "200": { $ref: "#/components/responses/RoomOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/data-centers/{id}/copy:
    post:
      summary: 深拷贝数据中心
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/CopyMoveBody" }
      responses: { "200": { $ref: "#/components/responses/DataCenterOK" } }
  /api/v1/rooms/{id}:
    put:
      summary: 更新机房
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/RoomBody" }
      responses:
        "200": { $ref: "#/components/responses/RoomOK" }
        "409": { $ref: "#/components/responses/Fail" }
    delete:
      summary: 删除机房（有机柜时 409）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/rooms/{id}/racks:
    post:
      summary: 创建机柜（可带模板快照）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/RackBody" }
      responses:
        "200": { $ref: "#/components/responses/RackOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/rooms/{id}/copy:
    post:
      summary: 深拷贝机房
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/CopyMoveBody" }
      responses: { "200": { $ref: "#/components/responses/RoomOK" } }
  /api/v1/rooms/{id}/move:
    post:
      summary: 跨数据中心迁移机房（version 校验先于其他参数）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/CopyMoveBody" }
      responses: { "200": { $ref: "#/components/responses/RoomOK" } }
  /api/v1/rooms/{id}/rack-diagram-import/validate:
    post:
      summary: 机柜图导入校验（两阶段第一步，返回 token 与逐行分类；coveredRackIds 必须属于 URL 机房）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/ImportValidateBody" }
      responses:
        "200": { $ref: "#/components/responses/ImportValidateOK" }
        "400": { $ref: "#/components/responses/Fail" }
  /api/v1/rooms/{id}/rack-diagram-import/commit:
    post:
      summary: 机柜图导入提交（单事务；失败零残留可重试；token 一次性且绑定发起人）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/ImportCommitBody" }
      responses:
        "200": { $ref: "#/components/responses/ImportCommitOK" }
        "400": { $ref: "#/components/responses/Fail" }
        "403": { $ref: "#/components/responses/Fail" }
        "410": { $ref: "#/components/responses/Fail" }
  /api/v1/racks/{id}:
    put:
      summary: 更新机柜
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/RackBody" }
      responses:
        "200": { $ref: "#/components/responses/RackOK" }
        "409": { $ref: "#/components/responses/Fail" }
    delete:
      summary: 删除机柜（在位设备或 PDU 存在时 409；FOR UPDATE 防并发上架）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/racks/{id}/copy:
    post:
      summary: 深拷贝机柜
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/CopyMoveBody" }
      responses: { "200": { $ref: "#/components/responses/RackOK" } }
  /api/v1/racks/{id}/move:
    post:
      summary: 跨机房迁移机柜（version 校验先于其他参数）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/CopyMoveBody" }
      responses: { "200": { $ref: "#/components/responses/RackOK" } }

  # ── 设备类型与设备写（system_admin） ──────────────────
  /api/v1/device-types/{id}:
    put:
      summary: 更新设备类型
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/DeviceTypeBody" }
      responses:
        "200": { $ref: "#/components/responses/DeviceTypeOK" }
        "409": { $ref: "#/components/responses/Fail" }
    delete:
      summary: 删除设备类型（被引用时 409）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/devices/{id}/assign:
    post:
      summary: 上架（策略开启时生成 PENDING 审批单；响应形状厂商式 {executed,device,approval}）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/AssignBody" }
      responses:
        "200": { $ref: "#/components/responses/AssignOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/devices/{id}/move:
    post:
      summary: 移位（策略开启时生成 PENDING 审批单；rackId/targetRackId 均可；有活动供电连接 → 409 DEVICE_POWERED，D01 方案 A）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/AssignBody" }
      responses:
        "200": { $ref: "#/components/responses/AssignOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/devices/{id}/decommission:
    post:
      summary: 下架退役（位置+生命周期+履历单事务）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/DecommissionBody" }
      responses:
        "200": { $ref: "#/components/responses/DeviceOK" }
        "409": { $ref: "#/components/responses/Fail" }

  # ── 模板与 PDU 写（system_admin） ─────────────────────
  /api/v1/rack-templates/{id}:
    put:
      summary: 更新模板元信息（系统内置禁改/禁删 409 SYSTEM_TEMPLATE_PROTECTED）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/TemplateUpdateBody" }
      responses:
        "200": { $ref: "#/components/responses/TemplateOK" }
        "409": { $ref: "#/components/responses/Fail" }
    delete:
      summary: 删除模板
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/rack-templates/{id}/versions:
    post:
      summary: 追加模板版本（revision 递增；stale version 409）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/TemplateVersionBody" }
      responses:
        "200": { $ref: "#/components/responses/TemplateOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/pdus/{id}:
    put:
      summary: 更新 PDU
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/PDUBody" }
      responses:
        "200": { $ref: "#/components/responses/PDUOK" }
        "409": { $ref: "#/components/responses/Fail" }
    delete:
      summary: 删除 PDU（有活动连接 409 PDU_IN_USE；无连接级联软删插座）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/pdu-sockets/{id}:
    put:
      summary: 更新插座
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/SocketBody" }
      responses:
        "200": { $ref: "#/components/responses/SocketOK" }
        "409": { $ref: "#/components/responses/Fail" }
    delete:
      summary: 删除插座（已连接时 409）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/pdu-sockets/{id}/connection:
    post:
      summary: 接电（插座占用/同角色已连/跨机柜均 409；连接与插座状态同事务）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/ConnectionBody" }
      responses:
        "200": { $ref: "#/components/responses/ConnectionOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/pdus/{id}/archive-impact:
    get:
      summary: 强制归档影响清单（先展示后确认）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/PDUImpactOK" }
  /api/v1/pdus/{id}/force-archive:
    post:
      summary: 管理员强制归档 PDU（confirmConnections 必须等于锁内实况，reason 必填；审计与归档同事务）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/ForceArchiveBody" }
      responses:
        "200": { $ref: "#/components/responses/PDUImpactOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/pdu-connections/{id}:
    delete:
      summary: 断开连接（version 可在 query 或 body；连接删除与插座释放同事务）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }

  # ── 后台管理（system_admin） ──────────────────────────
  /api/v1/admin/roles:
    get:
      summary: 角色列表
      responses: { "200": { $ref: "#/components/responses/RoleListOK" } }
  /api/v1/admin/users:
    get:
      summary: 用户列表
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: authSource, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/UserListOK" }
    post:
      summary: 创建用户（本地用户密码必填 >=8 位）
      requestBody: { $ref: "#/components/requestBodies/UserCreateBody" }
      responses:
        "200": { $ref: "#/components/responses/UserOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/admin/users/{id}:
    put:
      summary: 更新用户（最后管理员保护 409；启用→停用递增会话版本吊销全部旧 token）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/UserUpdateBody" }
      responses:
        "200": { $ref: "#/components/responses/UserOK" }
        "409": { $ref: "#/components/responses/Fail" }
    delete:
      summary: 删除用户（最后管理员保护；软删并递增会话版本）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/admin/users/{id}/reset-password:
    post:
      summary: 重置密码（>=8 位；递增会话版本，该用户全部已签发 token 立即失效）
      parameters: [{ $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Version" }]
      requestBody: { $ref: "#/components/requestBodies/ResetPasswordBody" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/admin/approval-policy:
    get:
      summary: 审批策略
      responses: { "200": { $ref: "#/components/responses/PolicyOK" } }
    put:
      summary: 更新审批策略
      requestBody: { $ref: "#/components/requestBodies/PolicyBody" }
      responses: { "200": { $ref: "#/components/responses/PolicyOK" } }
  /api/v1/admin/approvals:
    get:
      summary: 审批单列表（含设备详情）
      parameters: [{ name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }]
      responses: { "200": { $ref: "#/components/responses/ApprovalListOK" } }
  /api/v1/admin/approvals/{id}/approve:
    post:
      summary: 批准（条件占单+锁设备行+设备变更单事务；version 过期/设备被改 → RESOURCE_VERSION_CONFLICT）
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/ApproveBody" }
      responses:
        "200": { $ref: "#/components/responses/DeviceOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/admin/approvals/{id}/reject:
    post:
      summary: 拒绝
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody: { $ref: "#/components/requestBodies/ApproveBody" }
      responses:
        "200": { $ref: "#/components/responses/ApprovalOK" }
        "409": { $ref: "#/components/responses/Fail" }
  /api/v1/admin/ldap:
    get:
      summary: LDAP 配置（bindPassword 不回显）
      responses: { "200": { $ref: "#/components/responses/LDAPOK" } }
    put:
      summary: 更新 LDAP 配置
      requestBody: { $ref: "#/components/requestBodies/LDAPBody" }
      responses: { "200": { $ref: "#/components/responses/LDAPOK" } }
  /api/v1/admin/ldap/test:
    post:
      summary: LDAP 连通性探测（仅 TCP，非认证验证）
      requestBody: { $ref: "#/components/requestBodies/LDAPBody" }
      responses: { "200": { $ref: "#/components/responses/LDAPTestOK" } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'HS256，默认 2 小时；携带 jti（登出吊销单 token）与会话版本 sv（密码重置/停用/删除吊销该用户全部 token）'
  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Version:
      name: version
      in: query
      required: true
      description: 乐观锁版本（当前资源的 version 字段值）
      schema: { type: integer, minimum: 1 }
  responses:
    OK:
      description: 统一成功信封（data 为操作确认）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Fail:
      description: 统一失败信封（业务错误码见 schemas/Envelope.code）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    HealthOK:
      description: 健康信封
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { type: object, properties: { status: { type: string, example: alive } } }
    CaptchaOK:
      description: 验证码
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/Captcha" }
    LoginOK:
      description: 登录成功（token + 用户）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/LoginResult" }
    UserOK:
      description: 用户
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
    UserListOK:
      description: 用户列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/UserList" }
    RoleListOK:
      description: 角色列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Role" } }
    TreeOK:
      description: 资源树
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/TreeDataCenter" } }
    DataCenterOK:
      description: 数据中心
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/DataCenter" }
    RoomOK:
      description: 机房
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/Room" }
    RackOK:
