                properties:
                  data: { $ref: "#/components/schemas/DeviceType" }
    DeviceTypeListOK:
      description: 设备类型列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/DeviceType" } }
    DeviceOK:
      description: 设备
      content:
