              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/ImportValidateResult" }
    ImportCommitOK:
      description: 导入提交结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/ImportCommitResult" }
    PolicyOK:
      description: 审批策略
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationPolicy" }
    ApprovalOK:
      description: 审批单
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/ApprovalRecord" }
    ApprovalListOK:
      description: 审批单列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ApprovalRecord" } }
    LDAPOK:
      description: LDAP 配置
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/LDAPConfig" }
    LDAPTestOK:
      description: LDAP 探测结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/LDAPTestResult" }
  requestBodies:
    LoginBody:
      content:
        application/json:
          schema:
            type: object
            required: [username, password, captchaId, captcha]
            properties:
              username: { type: string }
              password: { type: string }
              captchaId: { type: string }
              captcha: { type: string, description: 4 位数字 }
    DataCenterBody:
      content:
        application/json:
          schema:
            type: object
            required: [code, name]
            properties:
              code: { type: string, maxLength: 50 }
              name: { type: string, maxLength: 150 }
              address: { type: string }
              longitude: { type: number }
              latitude: { type: number }
              status: { type: string, enum: [OPERATING, PLANNING, DISABLED, ARCHIVED] }
              manager: { type: string }
              contact: { type: string }
              serviceProvider: { type: string }
              remarks: { type: string }
              sortOrder: { type: integer }
    RoomBody:
      content:
        application/json:
          schema:
            type: object
            required: [code, name]
            properties:
              code: { type: string, maxLength: 50 }
              name: { type: string, maxLength: 150 }
              building: { type: string }
              floor: { type: string }
              roomNumber: { type: string }
              areaSquareMeters: { type: number }
              clearHeightMeters: { type: number }
              purpose: { type: string }
              status: { type: string }
              environmentLevel: { type: string }
              maxLoadKg: { type: number }
              coolingCapacityKw: { type: number }
              designPowerKw: { type: number }
              availablePowerKw: { type: number }
              usedPowerKw: { type: number }
              redundancyPolicy: { type: string }
              manager: { type: string }
              contact: { type: string }
              openHours: { type: string }
              accessNotes: { type: string }
              floorPlanEnabled: { type: boolean }
              floorPlanFormat: { type: string }
              racksPerRow: { type: integer }
              remarks: { type: string }
              sortOrder: { type: integer }
    RackBody:
      content:
        application/json:
          schema:
            type: object
            required: [code, name]
            properties:
              code: { type: string, maxLength: 50 }
              name: { type: string, maxLength: 150 }
              templateId: { type: string, format: uuid }
              type: { type: string }
              manufacturer: { type: string }
              modelNumber: { type: string }
              serialNumber: { type: string }
              assetNumber: { type: string }
              uHeight: { type: integer, minimum: 1 }
              widthMm: { type: integer }
              depthMm: { type: integer }
              heightMm: { type: integer }
              loadCapacityKg: { type: number }
              zone: { type: string }
              rackRow: { type: string }
              rackColumn: { type: string }
              aisle: { type: string }
              xCoordinate: { type: number }
              yCoordinate: { type: number }
              rotation: { type: integer }
              status: { type: string }
              manager: { type: string }
              department: { type: string }
              purpose: { type: string }
              dualPower: { type: boolean }
              inputCircuits: { type: integer }
              ratedVoltage: { type: number }
              ratedCurrent: { type: number }
              ratedPowerKw: { type: number }
              peakPowerKw: { type: number }
              pduCount: { type: integer }
              remarks: { type: string }
              sortOrder: { type: integer }
    DeviceTypeBody:
      content:
        application/json:
          schema:
            type: object
            required: [code, name, category]
            properties:
              code: { type: string, maxLength: 50 }
              name: { type: string, maxLength: 150 }
              category: { type: string, enum: [SERVER, NETWORK, STORAGE, SECURITY, POWER_ENVIRONMENT, ACCESSORY] }
              status: { type: string }
              defaultHeightU: { type: integer }
              defaultWeightKg: { type: number }
              defaultRatedPowerW: { type: number }
              defaultPeakPowerW: { type: number }
              defaultDualPower: { type: boolean }
              description: { type: string }
              sortOrder: { type: integer }
    DeviceBody:
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              typeId: { type: string, format: uuid }
              code: { type: string }
              name: { type: string, maxLength: 150 }
              assetNumber: { type: string }
              serialNumber: { type: string }
              manufacturer: { type: string }
              modelNumber: { type: string }
              specification: { type: string }
              firmwareVersion: { type: string }
              purchaseBatch: { type: string }
              organization: { type: string }
              manager: { type: string }
              contact: { type: string }
              businessSystem: { type: string }
              applicationName: { type: string }
              lifecycleStatus: { type: string }
              heightU: { type: integer, minimum: 1 }
              weightKg: { type: number }
              ratedPowerW: { type: number }
              peakPowerW: { type: number }
              inputVoltage: { type: number }
              dualPowerRequired: { type: boolean }
              managementIp: { type: string }
              businessIp: { type: string }
              macAddress: { type: string }
              managementProtocol: { type: string }
              monitoringStatus: { type: string }
              externalQrCode: { type: string }
              externalQrCodeUrl: { type: string }
              tags: { type: string }
              remarks: { type: string }
    AssignBody:
      content:
        application/json:
          schema:
            type: object
            description: 目标机柜接受 targetRackId 或 rackId（兼容厂商前端）；version 可选（body 乐观锁）
            properties:
              targetRackId: { type: string, format: uuid }
              rackId: { type: string, format: uuid }
              startU: { type: integer, minimum: 1 }
              heightU: { type: integer }
              orientation: { type: string, enum: [NORMAL, REVERSE] }
              reason: { type: string }
              version: { type: integer, minimum: 1 }
    DecommissionBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: { type: string }
    TemplateCreateBody:
      content:
        application/json:
          schema:
            type: object
            required: [code, name, version]
            properties:
              code: { type: string, maxLength: 50 }
              name: { type: string, maxLength: 150 }
              description: { type: string }
              status: { type: string }
              remarks: { type: string }
              version: { $ref: "#/components/schemas/TemplateVersionInput" }
    TemplateUpdateBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, minLength: 1, maxLength: 150 }
              description: { type: string }
              status: { type: string }
              remarks: { type: string }
    TemplateVersionBody:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TemplateVersionInput" }
    PDUBody:
      content:
        application/json:
          schema:
            type: object
            required: [code, name]
            properties:
              code: { type: string, maxLength: 80 }
              name: { type: string, maxLength: 150 }
              manufacturer: { type: string }
              modelNumber: { type: string }
              serialNumber: { type: string }
              inputVoltage: { type: number }
              ratedPowerW: { type: number }
              ratedCurrentA: { type: number }
              status: { type: string }
              remarks: { type: string }
    SocketBody:
      content:
        application/json:
          schema:
            type: object
            required: [socketNo, standard, amperageA]
            properties:
              socketNo: { type: integer }
              standard: { type: string, enum: [CN, EU] }
              amperageA: { type: integer }
              label: { type: string }
              # 兼容保留、服务端忽略（C10）：socket status 仅由连接事实（Connect/
              # Disconnect/ForceArchive）维护，不接受客户端直写。
              status: { type: string, deprecated: true }
    ConnectionBody:
      content:
        application/json:
          schema:
            type: object
            required: [deviceId]
            properties:
              deviceId: { type: string, format: uuid }
              powerW: { type: number }
              circuit: { type: string }
              redundancyRole: { type: string, enum: [PRIMARY, STAND_BY] }
    ForceArchiveBody:
      content:
        application/json:
          schema:
            type: object
            required: [reason, confirmConnections]
            properties:
              version: { type: integer, minimum: 1 }
              reason: { type: string, minLength: 1 }
              confirmConnections: { type: integer, description: 必须等于影响清单中的活动连接数 }
    UserCreateBody:
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username: { type: string, maxLength: 100 }
              displayName: { type: string }
              password: { type: string, minLength: 8 }
              email: { type: string }
              authSource: { type: string, default: local }
              roleCodes: { type: array, items: { type: string } }
              enabled: { type: boolean, default: true }
    UserUpdateBody:
      content:
        application/json:
          schema:
            type: object
            description: 部分更新——空字段保留原值
            properties:
              username: { type: string }
              displayName: { type: string }
              email: { type: string }
              authSource: { type: string }
              roleCodes: { type: array, items: { type: string } }
              enabled: { type: boolean }
    ResetPasswordBody:
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password: { type: string, minLength: 8 }
    PolicyBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              assignApprovalEnabled: { type: boolean }
              moveApprovalEnabled: { type: boolean }
              approvalMode: { type: string }
              defaultApproverRole: { type: string }
    ApproveBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              version: { type: integer, minimum: 1 }
              comment: { type: string }
    LDAPBody:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LDAPConfig" }
    ImportValidateBody:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ImportValidateInput" }
    ImportCommitBody:
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
              decisions:
                type: array
                items:
                  type: object
                  properties:
                    itemId: { type: string }
                    action: { type: string, enum: [UPDATE_EXISTING, CREATE_NEW, DECOMMISSION, IGNORE, SKIP] }
    CopyMoveBody:
      content:
        application/json:
          schema:
            type: object
            required: [code, name]
            properties:
              code: { type: string, maxLength: 50 }
