services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cabinet
      POSTGRES_USER: cabinet
      POSTGRES_PASSWORD: ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinet -d cabinet"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    image: diff-rebuild:ci
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      MIGRATIONS_DIR: /app/migrations
      DATABASE_URL: postgres://cabinet:ci@postgres:5432/cabinet?sslmode=disable
      JWT_SECRET: ci-diff-replay-secret-32-bytes!!
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "DiffCi#2026!"
      # golden 套件在 1 分钟内多次登录（每次消耗 captcha+login 两格），CI 栈放宽限流；
      # 生产默认 10/min 不受影响（复评：套件级限流放宽只在测试环境生效）
      LOGIN_RATE_LIMIT_PER_MIN: "200"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
